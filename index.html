<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Editor de Imagens IA - Remoção de Fundo</title>
    <meta name="description" content="Remova o fundo de imagens automaticamente com IA, diretamente no navegador.">

    <!-- Carregamento da biblioteca via UNPKG (alternativa ao jsDelivr bloqueado) -->
    <script type="module">
        import { removeBackground } from 'https://unpkg.com/@imgly/background-removal@1.7.0/dist/browser.mjs';
        window.__removeBackground = removeBackground;
        window.__iaCarregada = true;
        document.dispatchEvent(new Event('ia-pronta'));
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            padding: 30px 20px;
            max-width: 860px;
            margin: auto;
            background: linear-gradient(135deg, #f0f4ff 0%, #f9fafb 100%);
            min-height: 100vh;
        }

        h1 {
            color: #1e293b;
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 28px;
        }

        #drop-zone {
            width: 100%;
            height: 180px;
            border: 2px dashed #4A90E2;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(239, 246, 255, 0.8);
            cursor: pointer;
            border-radius: 14px;
            margin-bottom: 16px;
            color: #4A90E2;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.25s ease;
            backdrop-filter: blur(4px);
        }

        #drop-zone:hover,
        #drop-zone.drag-over {
            background: #dbeafe;
            border-color: #2563eb;
            color: #2563eb;
            transform: scale(1.01);
        }

        #status-ia {
            text-align: center;
            margin-top: 0;
            margin-bottom: 16px;
            font-weight: 600;
            padding: 14px 20px;
            border-radius: 10px;
            background: #e0e7ff;
            color: #3730a3;
            font-size: 0.92rem;
            transition: all 0.3s ease;
        }

        .batch-preview {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card-imagem {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .thumb {
            width: 220px;
            height: 220px;
            object-fit: contain;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            background-image: linear-gradient(45deg, #f1f5f9 25%, transparent 25%),
                linear-gradient(-45deg, #f1f5f9 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #f1f5f9 75%),
                linear-gradient(-45deg, transparent 75%, #f1f5f9 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            background-color: #fff;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            transition: opacity 0.4s ease;
        }

        .btn-download {
            display: none;
            padding: 8px 18px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
            text-decoration: none;
        }

        .btn-download:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <h1>🖼️ Editor de Imagens IA</h1>
    <p class="subtitle">Remoção de fundo automática com Inteligência Artificial — 100% no navegador</p>

    <div id="drop-zone" id="drop-zone">📂 Arraste suas imagens aqui ou clique para selecionar</div>
    <input type="file" id="file-input" multiple hidden accept="image/*">

    <div id="status-ia">⏳ Carregando biblioteca de IA... Aguarde.</div>

    <div class="batch-preview" id="preview-area"></div>

    <script>
        const statusDiv = document.getElementById('status-ia');
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const previewArea = document.getElementById('preview-area');

        let iaDisponivel = false;

        // Aguarda a biblioteca carregar
        document.addEventListener('ia-pronta', () => {
            iaDisponivel = true;
            statusDiv.innerText = '✅ IA pronta! Arraste uma imagem para remover o fundo.';
            statusDiv.style.backgroundColor = '#d1fae5';
            statusDiv.style.color = '#065f46';
        });

        // Timeout: se a IA não carregar em 20s, avisar o usuário
        setTimeout(() => {
            if (!iaDisponivel) {
                statusDiv.innerText = '⚠️ A biblioteca de IA ainda está carregando ou sua rede está lenta. Aguarde mais um pouco...';
                statusDiv.style.backgroundColor = '#fef3c7';
                statusDiv.style.color = '#92400e';
            }
        }, 20000);

        // Lógica de Interface
        dropZone.onclick = () => fileInput.click();
        dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); };
        dropZone.ondragleave = () => { dropZone.classList.remove('drag-over'); };
        dropZone.ondrop = (e) => { e.preventDefault(); dropZone.classList.remove('drag-over'); handleFiles(e.dataTransfer.files); };
        fileInput.onchange = (e) => handleFiles(e.target.files);

        function handleFiles(files) {
            if (!iaDisponivel) {
                statusDiv.innerText = '⚠️ A IA ainda está carregando. Aguarde e tente novamente.';
                statusDiv.style.backgroundColor = '#fef3c7';
                statusDiv.style.color = '#92400e';
                return;
            }

            for (let file of files) {
                if (!file.type.startsWith('image/')) continue;

                const card = document.createElement('div');
                card.className = 'card-imagem';

                const img = document.createElement('img');
                img.src = URL.createObjectURL(file);
                img.className = 'thumb';
                img.style.opacity = '0.4';

                const btn = document.createElement('a');
                btn.className = 'btn-download';
                btn.innerText = '⬇️ Baixar PNG';
                btn.download = 'sem-fundo.png';

                card.appendChild(img);
                card.appendChild(btn);
                previewArea.appendChild(card);

                processarImagem(file, img, btn);
            }
        }

        async function processarImagem(arquivoImagem, imgElemento, btnDownload) {
            try {
                statusDiv.innerText = '⏳ Processando: Removendo fundo com IA...';
                statusDiv.style.backgroundColor = '#fef3c7';
                statusDiv.style.color = '#92400e';

                const removeBackground = window.__removeBackground;

                // Usando UNPKG como servidor de dados (mais confiável)
                const config = {
                    publicPath: 'https://unpkg.com/@imgly/background-removal-data/dist/'
                };

                const imageBlob = await removeBackground(arquivoImagem, config);

                const urlSemFundo = URL.createObjectURL(imageBlob);
                imgElemento.src = urlSemFundo;
                imgElemento.style.opacity = '1';

                btnDownload.href = urlSemFundo;
                btnDownload.style.display = 'block';

                statusDiv.innerText = '✅ Fundo removido com sucesso! Clique em "Baixar PNG" para salvar.';
                statusDiv.style.backgroundColor = '#d1fae5';
                statusDiv.style.color = '#065f46';

            } catch (erro) {
                console.error('Erro detalhado no Console:', erro);

                let msgErro = '❌ Falha no processamento.';
                if (erro.message) {
                    if (erro.message.includes('fetch') || erro.message.includes('network')) {
                        msgErro = '❌ Erro de rede: Não foi possível baixar os modelos da IA.';
                    } else {
                        msgErro = '❌ Erro: ' + erro.message;
                    }
                }

                statusDiv.innerText = msgErro + ' (Detalhe: ' + erro.toString() + ')';
                statusDiv.style.backgroundColor = '#fee2e2';
                statusDiv.style.color = '#991b1b';
                imgElemento.style.opacity = '1';
            }
        }
    </script>

</body>

</html>
