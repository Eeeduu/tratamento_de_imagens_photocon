<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>AI Image Lab</title>
    <script src="https://cdn.jsdelivr.net/npm/fabric"></script>
    <style>
        /* Estilo para a zona de arrastar imagens */
        #drop-zone {
            width: 100%;
            height: 200px;
            border: 3px dashed #4A90E2;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f7ff;
            cursor: pointer;
        }
        .batch-preview { display: flex; gap: 10px; margin-top: 20px; overflow-x: auto; }
        .thumb { width: 100px; height: 100px; object-fit: cover; border-radius: 8px; }
    </style>
</head>
<body>

    <h1>AI Image Editor (Lote & IA)</h1>

    <div id="drop-zone">Arraste suas imagens aqui ou clique para selecionar</div>
    <input type="file" id="file-input" multiple hidden>

    <div class="batch-preview" id="preview-area"></div>

    <div class="controls">
        <button onclick="removeBackgroundBatch()">Remover Fundo (Lote)</button>
        <button onclick="addWatermark()">Adicionar Texto</button>
    </div>

    <canvas id="main-editor"></canvas>

  <div id="status-ia" style="margin-top: 10px; font-weight: bold; color: #4A90E2;">Aguardando imagens...</div>

    <script type="module">
        // Importamos a ferramenta específica de remoção de fundo (gratuita e sem bloqueios)
        import imglyRemoveBackground from 'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/dist/browser.mjs';

        const statusDiv = document.getElementById('status-ia');
        let filesQueue = [];

        // Lógica de Drag and Drop
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');

        dropZone.onclick = () => fileInput.click();
        dropZone.ondragover = (e) => { e.preventDefault(); dropZone.style.background = "#e0eefe"; };
        dropZone.ondragleave = () => dropZone.style.background = "#f0f7ff";
        dropZone.ondrop = (e) => {
            e.preventDefault();
            dropZone.style.background = "#f0f7ff";
            handleFiles(e.dataTransfer.files);
        };
        fileInput.onchange = (e) => handleFiles(e.target.files);

        function handleFiles(files) {
            for (let file of files) {
                // Mostra a miniatura da imagem original na tela
                const img = document.createElement('img');
                img.src = URL.createObjectURL(file);
                img.className = 'thumb';
                img.style.opacity = "0.5"; // Deixa meio transparente para indicar que está processando
                document.getElementById('preview-area').appendChild(img);

                // Envia para a IA processar
                processarImagem(file, img);
            }
        }

        async function processarImagem(arquivoImagem, imgElemento) {
            try {
                statusDiv.innerText = "IA: Baixando modelo e removendo fundo (Aguarde...)";
                statusDiv.style.color = "#f0ad4e";

                // A mágica acontece aqui! A biblioteca lida com o modelo e os workers sozinha.
                // Na primeira vez, ela baixa o modelo (aprox. 40MB). Nas próximas, é instantâneo.
                const imageBlob = await imglyRemoveBackground(arquivoImagem);
                
                // Pega o resultado sem fundo e substitui a imagem original na tela
                const urlSemFundo = URL.createObjectURL(imageBlob);
                imgElemento.src = urlSemFundo;
                imgElemento.style.opacity = "1"; // Volta a opacidade ao normal

                statusDiv.innerText = "IA: Fundo removido com sucesso!";
                statusDiv.style.color = "#5cb85c";

            } catch (erro) {
                console.error(erro);
                statusDiv.innerText = "Erro ao processar: " + erro.message;
                statusDiv.style.color = "#d9534f";
            }
        }
    </script>
</body>
</html>
